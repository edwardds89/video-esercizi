# Tiene sveglio il progetto Supabase del piano gratuito (si mette in pausa dopo 7 giorni senza attività).
# v3 (30/9/2026): il sito usa il progetto "pauselearn" (ytryyxgkhhvgqieodhkk, account edoardo@pauselearn.com),
# non più "video-lezioni" (raakqcqrcgbfncevxauz, account edoardo@myself.com). La v2 teneva sveglio solo quello vecchio.
# Ogni 2 giorni chiama keepalive_ping(), che SCRIVE la data in public.keepalive (una riga, RLS senza policy).
# Il job fallisce se il progetto principale non risponde 200; quello vecchio è pingato finché non si decide cosa farne.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping progetto pauselearn (quello usato dal sito)
        run: |
          K="sb_publishable_ui2DOBm4ruFSwDrrcGWgkQ_yv0392uW"
          out=$(curl -sS -w "\nHTTP %{http_code}" -X POST \
            -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{}' https://ytryyxgkhhvgqieodhkk.supabase.co/rest/v1/rpc/keepalive_ping)
          echo "$out"
          echo "$out" | tail -n1 | grep -q "HTTP 200"
      - name: Ping progetto vecchio video-lezioni (non blocca)
        continue-on-error: true
        run: |
          K="sb_publishable_40BFSphEmaZ0u7FU9MI8_w_ZHEwunq-"
          curl -sS -w "\nHTTP %{http_code}\n" -X POST \
            -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{}' https://raakqcqrcgbfncevxauz.supabase.co/rest/v1/rpc/keepalive_ping
