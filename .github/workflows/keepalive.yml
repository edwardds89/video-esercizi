# Tiene sveglio il progetto Supabase del piano gratuito (si mette in pausa dopo 7 giorni senza attività).
# v2 (30/9/2026): la vecchia lettura anonima della tabella lessons rispondeva 200 ma vuota (RLS) e Supabase NON la
# contava come attività (mail di preavviso pausa del 30/9). Ora ogni 2 giorni chiama la funzione keepalive_ping(),
# che SCRIVE la data del ping in public.keepalive (una riga sola, RLS senza policy: invisibile da fuori).
# Funzione e tabella create dal SQL editor il 30/9 (vedi CLAUDE.md, voce "KEEP-ALIVE SUPABASE").
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scrive il ping nel progetto video-lezioni
        run: |
          out=$(curl -sS -w "\nHTTP %{http_code}" -X POST \
            -H "apikey: sb_publishable_40BFSphEmaZ0u7FU9MI8_w_ZHEwunq-" \
            -H "Authorization: Bearer sb_publishable_40BFSphEmaZ0u7FU9MI8_w_ZHEwunq-" \
            -H "Content-Type: application/json" -d '{}' \
            "https://raakqcqrcgbfncevxauz.supabase.co/rest/v1/rpc/keepalive_ping")
          echo "$out"
          echo "$out" | tail -1 | grep -q "HTTP 200"
